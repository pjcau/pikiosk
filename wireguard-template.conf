# WireGuard VPN configuration template
# Download your actual config from: https://account.proton.me/vpn/wireguard
# Choose a server in the country you need, then save it as:
#   config/wireguard.conf
# (this file is excluded from git via .gitignore)

[Interface]
# PrivateKey = YOUR_PRIVATE_KEY
# Address = YOUR_VPN_ADDRESS
# DNS = YOUR_DNS

[Peer]
# PublicKey = SERVER_PUBLIC_KEY
# Endpoint = SERVER_IP:PORT
# AllowedIPs = 0.0.0.0/0
