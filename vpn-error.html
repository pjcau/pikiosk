<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="30">
  <title>VPN Not Connected</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a1a;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      gap: 30px;
    }
    .icon { font-size: 100px; }
    h1 { font-size: 48px; color: #ff4444; }
    p  { font-size: 24px; color: #aaa; max-width: 600px; line-height: 1.6; }
    .retry { font-size: 18px; color: #555; margin-top: 10px; }
    .pulse {
      width: 20px; height: 20px;
      background: #ff4444;
      border-radius: 50%;
      display: inline-block;
      animation: pulse 1.5s infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes pulse {
      0%   { transform: scale(1);   opacity: 1; }
      50%  { transform: scale(1.4); opacity: 0.5; }
      100% { transform: scale(1);   opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="icon">🔒</div>
  <h1>VPN Not Connected</h1>
  <p>
    The VPN connection is not active.<br>
    Content cannot be loaded securely.
  </p>
  <p class="retry">
    <span class="pulse"></span>
    Retrying automatically in 30 seconds…
  </p>
</body>
</html>
