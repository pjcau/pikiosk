# portal.conf — Parametri del wifi-portal, condivisi da server.py, hotspot.sh e launch-kiosk.sh.
# Vengono esportati come variabili d'ambiente prima di avviare il portal.
# NB: questa NON e' la password di una WiFi vera: e' la password dell'hotspot di setup
# che il Pi crea quando e' offline. Serve solo per il QR di auto-join dal telefono.

# SSID dell'hotspot di setup che il Pi crea quando manca la connessione.
HOTSPOT_SSID="pikiosk-setup"

# Password dell'hotspot (WPA2). Minimo 8 caratteri. Cambiala pure.
HOTSPOT_PASS="pikiosk1234"

# Porta e bind del portal. 0.0.0.0 = raggiungibile sia da localhost (schermo HDMI)
# sia dal telefono connesso all'hotspot.
PORTAL_PORT="8080"
PORTAL_HOST="0.0.0.0"

# Secondi senza connettivita' prima di entrare in modalita' setup (auto-trigger).
SETUP_TIMEOUT="60"
