<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="15">
  <title>Riconnessione in corso</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a1a;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      gap: 30px;
    }
    .spinner {
      width: 84px; height: 84px;
      border: 8px solid #2a3a55;
      border-top-color: #4a9eff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 44px; color: #4a9eff; }
    p  { font-size: 24px; color: #aaa; max-width: 620px; line-height: 1.6; }
    .hint { font-size: 18px; color: #555; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h1>Riconnessione in corso…</h1>
  <p>
    Sto ripristinando la rete e la VPN.<br>
    Il contenuto riparte da solo appena la connessione è pronta.
  </p>
  <p class="hint">Ricontrollo automaticamente ogni pochi secondi…</p>
</body>
</html>
